<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>عرض سعر | نايس</title><link rel="stylesheet" href="/styles.css"><style>
.quote-page{min-height:100dvh;background:#f5f6f8;padding:30px 0}.quote-shell{width:min(840px,92%);margin:auto}.quote-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.quote-paper{background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:32px;box-shadow:0 22px 70px rgba(17,24,39,.08)}.quote-brand{display:flex;align-items:center;gap:12px}.quote-brand .logo-mark{flex:0 0 auto}.lookup{max-width:520px;margin:70px auto 0}.lookup form{display:grid;gap:10px}.lookup input{min-height:50px;border:1px solid #e5e7eb;border-radius:12px;padding:10px 12px}.q-head{display:grid;grid-template-columns:1fr auto;gap:20px;padding-bottom:20px;border-bottom:1px solid #e5e7eb}.q-code{direction:ltr;text-align:left}.q-code b{font-size:20px}.q-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.q-meta div{background:#f8fafc;border-radius:12px;padding:10px}.q-meta small,.q-meta b{display:block}.q-meta small{color:#6b7280}.q-table{width:100%;border-collapse:collapse}.q-table th,.q-table td{padding:12px 8px;border-bottom:1px solid #eef0f2;text-align:right}.q-totals{margin:20px 0 0 auto;width:min(360px,100%);display:grid;gap:8px}.q-totals div{display:flex;justify-content:space-between}.q-totals .grand{background:#111827;color:#fff;border-radius:12px;padding:12px;font-size:18px}.q-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}.quote-error{padding:14px;background:#fef2f2;color:#991b1b;border-radius:12px;margin-top:10px}@media(max-width:600px){.quote-page{padding:14px 0}.quote-paper{padding:18px;border-radius:18px}.q-head{grid-template-columns:1fr}.q-code{text-align:right}.q-meta{grid-template-columns:1fr 1fr}.q-table{font-size:11px}.q-actions{display:grid}.q-actions .btn{width:100%}}</style></head><body><main class="quote-page"><div class="quote-shell"><div class="quote-top"><a href="/" class="quote-brand"><span id="qLogo" class="logo-mark">N</span><span><b id="qCompany">نايس للدعاية والإعلان</b><small style="display:block;color:#6b7280">Nice for Advertising</small></span></a><a href="/" class="btn ghost btn-small">العودة للموقع</a></div><section id="lookup" class="quote-paper lookup"><span class="eyebrow">QUOTATION</span><h1>عرض سعر نايس</h1><p>أدخل رقم الهاتف المرتبط بعرض السعر لعرض التفاصيل.</p><form id="quoteLookup"><input id="quoteCode" placeholder="رقم عرض السعر NQ-..." required><input id="quotePhone" placeholder="رقم الهاتف" required><button class="btn">عرض التفاصيل</button></form><div id="lookupError"></div></section><section id="quotePaper" class="quote-paper hidden"></section></div></main><script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('ar-YE',{maximumFractionDigits:2})+' ر.ي';const params=new URLSearchParams(location.search);$('#quoteCode').value=params.get('code')||'';
async function api(u){const r=await fetch(u);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'error');return d}async function loadSettings(){try{const s=await api('/api/settings');$('#qCompany').textContent=s.company_name||'نايس للدعاية والإعلان';document.documentElement.style.setProperty('--primary',s.primary_color||'#111827');document.documentElement.style.setProperty('--accent',s.accent_color||'#f59e0b');if(s.logo_url)$('#qLogo').innerHTML='<img src="'+esc(s.logo_url)+'">'}catch{}}loadSettings();
$('#quoteLookup').onsubmit=async e=>{e.preventDefault();$('#lookupError').innerHTML='';try{const q=await api('/api/quote/'+encodeURIComponent($('#quoteCode').value.trim())+'?phone='+encodeURIComponent($('#quotePhone').value.trim()));render(q)}catch{$('#lookupError').innerHTML='<div class="quote-error">لم نجد العرض بهذه البيانات. تأكد من رقم العرض والهاتف.</div>'}};
function render(q){$('#lookup').classList.add('hidden');$('#quotePaper').classList.remove('hidden');$('#quotePaper').innerHTML=`<div class="q-head"><div><span class="eyebrow">NICE QUOTATION</span><h1>عرض سعر</h1><p>السادة/ ${esc(q.business_name||q.customer_name)}</p></div><div class="q-code"><small>رقم العرض</small><b>${esc(q.code)}</b><small>الحالة: ${esc(q.status)}</small></div></div><div class="q-meta"><div><small>العميل</small><b>${esc(q.customer_name)}</b></div><div><small>الهاتف</small><b>${esc(q.phone)}</b></div><div><small>صالح حتى</small><b>${esc(q.valid_until||'غير محدد')}</b></div></div><div class="table-wrap"><table class="q-table"><thead><tr><th>البند</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th></tr></thead><tbody>${q.items.map(i=>`<tr><td>${esc(i.description)}</td><td>${i.quantity}</td><td>${money(i.unit_price)}</td><td>${money(i.total)}</td></tr>`).join('')}</tbody></table></div><div class="q-totals"><div><span>المجموع</span><b>${money(q.subtotal)}</b></div>${q.discount>0?`<div><span>الخصم</span><b>${money(q.discount)}</b></div>`:''}<div class="grand"><span>الإجمالي</span><b>${money(q.total)}</b></div></div>${q.notes?`<p><b>ملاحظات:</b> ${esc(q.notes)}</p>`:''}<div class="q-actions"><button class="btn ghost" onclick="print()">طباعة / حفظ PDF</button><a class="btn" href="https://wa.me/967784580808?text=${encodeURIComponent('مرحباً نايس، بخصوص عرض السعر '+q.code)}" target="_blank">مراسلة نايس</a></div>`;}
</script></body></html>
